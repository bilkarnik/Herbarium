<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Хербариум</title>

    <style>
        :root{--bg:#FAFBFB;--ink:#334155;--green:#1B4332;--teal:#2A9D8F;--line:#d5dddb;--card:#fff;--tint:#e8f3f0;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

        :root[data-theme="dark"]{--bg:#0e1714;--ink:#c9d3d1;--green:#9fd3b8;--teal:#4cc2b2;--line:#27413a;--card:#13211d;--tint:#193029;color-scheme:dark}
        *{box-sizing:border-box}
        html{scroll-padding-top:env(safe-area-inset-top,0px)}
        body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,sans-serif}
        body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
        header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
        .bar{max-width:1080px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap}
        .brand{font:600 30px/1 "Cormorant Garamond",Georgia,serif;color:var(--green);text-decoration:none}
        nav{display:flex;gap:2px 20px;flex:1;flex-wrap:wrap}
        nav a{color:var(--ink);text-decoration:none;font-size:14px;padding:4px 0;border-bottom:2px solid transparent}
        nav a.on{color:var(--green);border-color:var(--teal);font-weight:600}
        a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
        .lang button{font:600 12px Inter,sans-serif;border:1px solid var(--line);background:none;color:var(--ink);padding:5px 10px;cursor:pointer}
        .lang button[aria-pressed=true]{background:var(--green);color:var(--bg);border-color:var(--green)}
        main{max-width:1080px;margin:auto;padding:48px 20px 72px}
        h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;color:var(--green);font-weight:600;line-height:1.02;margin:0}
        h1{font-size:clamp(52px,11vw,112px);letter-spacing:-.015em}
        h2{font-size:clamp(32px,5vw,46px);margin:64px 0 22px}
        h3{font-size:30px}
        .lat{font:italic 500 20px "Cormorant Garamond",Georgia,serif;color:var(--teal);margin:2px 0 14px}
        .lead{font-size:18px;max-width:34em;margin:22px 0 30px}
        .btn{display:inline-block;background:var(--green);color:var(--bg);padding:12px 24px;text-decoration:none;font-weight:600;font-size:14px}
        .hero{display:grid;grid-template-columns:1.35fr 1fr;gap:44px;align-items:center}
        .plate{border:1px solid var(--line);background:var(--card);padding:26px 26px 14px;text-align:center;color:var(--green)}
        .plate svg{width:100%;max-height:310px}
        .plate p{margin:10px 0 0;border-top:1px solid var(--line);padding-top:10px;font:italic 500 18px "Cormorant Garamond",Georgia,serif}
        .mono{font:600 110px/1.1 "Cormorant Garamond",Georgia,serif;padding:30px 0}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
        .card{border:1px solid var(--line);background:var(--card);padding:20px}
        .meta{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;font-size:13px;color:var(--teal);font-weight:600}
        dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:14px;margin:0 0 14px}
        dt{color:var(--teal);font-weight:600}
        dd{margin:0}
        .card p:last-child{font-size:14px;margin:0}
        input{width:100%;max-width:480px;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:8px 0 28px}
        .cal{overflow-x:auto}
        table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
        th,td{border:1px solid var(--line);padding:8px 4px;text-align:center}
        th:first-child,td:first-child{text-align:left;padding-left:10px;white-space:nowrap}
        td.on{background:var(--teal);color:var(--bg);font-size:9px}
        th.now{background:var(--tint);color:var(--green)}
        td.now{box-shadow:inset 0 0 0 2px var(--green)}
        .big{font:500 clamp(24px,4vw,38px) "Cormorant Garamond",Georgia,serif;color:var(--green);word-break:break-all}
        footer{border-top:1px solid var(--line);padding:26px 20px;max-width:1080px;margin:auto;font-size:13px}
        footer p{margin:0 0 4px}
        .row{display:grid;grid-template-columns:1fr 2fr;gap:6px 28px;padding:18px 0;border-top:1px solid var(--line)}.row h3{font-size:26px}.row p{margin:0}
        .hl{border-color:var(--teal);box-shadow:inset 0 3px 0 var(--teal)}.sub{font-size:14px;margin:6px 0 0}
        .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px;margin:24px 0}.form label{font-size:13px;font-weight:600;color:var(--teal)}.form input{margin:4px 0 0;max-width:none;color:var(--ink);font-weight:400}
        .months{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:24px}.months label{font-size:14px}.months input{width:auto;margin:0 5px 0 0}
        textarea{width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:13px/1.5 ui-monospace,Menlo,monospace;margin:12px 0}
        ol{padding-left:20px;max-width:40em}
        .card ul,.card ol{padding-left:18px;margin:0 0 12px;font-size:14px}.card li{margin:3px 0}.k{font-size:13px;font-weight:600;color:var(--teal);margin:12px 0 4px}
        .form textarea{margin:4px 0 0;width:100%;font:14px/1.5 Inter,sans-serif;color:var(--ink)}
        @media(max-width:720px){.hero{grid-template-columns:1fr;gap:28px}.plate{max-width:280px}.row{grid-template-columns:1fr}}
    </style>
<link rel="icon" href="icon.ico">
</head>

        document.documentElement.lang=L;document.title=name+" — "+t(pg);if(pg==="add")bindAdd();
        const q=$("#q");if(q)q.oninput=()=>{const v=q.value.trim().toLowerCase();let n=0;
            document.querySelectorAll(".card").forEach(c=>{const h=!c.dataset.q.includes(v);c.hidden=h;if(!h)n++});$("#none").hidden=n>0};
    }
    document.querySelector(".lang").onclick=e=>{const l=e.target.dataset.l;if(!l)return;L=l;try{localStorage.setItem("lang",l)}catch(x){}render()};
    addEventListener("hashchange",()=>{render();scrollTo(0,0)});
    render();
</script>
</body>
</html>
